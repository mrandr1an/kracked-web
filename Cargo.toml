[package]
name = "kracked-web"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = "0.7.5"
tokio = { version = "1.38.0", features = ["full"] }
orgize = {version = "0.9.0", features = ["ser","chrono","syntect"] }
slugify = "0.1.0"
serde = "1.0.203"
chrono = "0.4.38"
serde_json = "1.0.117"
toml = "0.8.14"
tower-http = { version = "0.5.2", features = ["fs"] }
